version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      golang-x:
        patterns:
          - golang.org/x/*
      aws:
        patterns:
          - github.com/aws/*
      # The generator and the runtime of its code move together: a newer generator writes code
      # an older runtime lacks.
      oapi-codegen:
        patterns:
          - github.com/oapi-codegen/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
