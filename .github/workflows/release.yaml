name: goreleaser

on:
  push:
    tags:
      - '*'
  # By hand, on a tag: a tag whose commit says [skip ci] starts no workflow of its own.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        # Run by hand, it releases the tag it is run on: a branch has no version to release.
        name: A tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          echo "::error::Run it on a tag: Use workflow from, Tags, the version to release."
          exit 1
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Test
        run: go test ./...
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        # dockers_v2 builds every platform's image at once.
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  addon-repository:
    # Tell the add-on repository that a version exists, once its images do: it publishes it to Home
    # Assistant. Needs the secret DISPATCH_TOKEN, a token allowed to dispatch to that repository;
    # without it, nothing is told. Not for a prerelease, as v1.0.0-rc.1.
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
    steps:
      -
        if: env.DISPATCH_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/miguelangel-nubla/hassio-repository/dispatches \
            -d '{"event_type":"update","client_payload":{"app":"ipv6ddns"}}'

  homebrew-tap:
    # The formula of the tap, miguelangel-nubla/homebrew-tap, is of this version once it is
    # released: it builds from the source of the tag. Needs the secret HOMEBREW_TAP_TOKEN, a token
    # allowed to write to that repository; without it, nothing is changed, and
    # tools/homebrew-formula.sh does it by hand. Not for a prerelease, as v1.0.0-rc.1.
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      -
        name: Checkout
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone -q "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/miguelangel-nubla/homebrew-tap.git" "$RUNNER_TEMP/tap"
          tools/homebrew-formula.sh "$TAG" "$RUNNER_TEMP/tap/Formula/ipv6ddns.rb"
          cd "$RUNNER_TEMP/tap"
          # Run again on a tag, the formula is already of it.
          git diff --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "ipv6ddns ${TAG#v}"
          git push -q
