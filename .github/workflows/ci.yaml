name: ci

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly too: new vulnerabilities, and new Go releases, come without a commit.
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Generate
        run: go generate ./...
      -
        # Home Assistant's library for ESPHome devices, at the version Home Assistant uses: the
        # tests of the integration connect with it, and fail rather than skip without it.
        name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      -
        name: Install aioesphomeapi
        run: pip install aioesphomeapi==46.30.1
      -
        # For the test of discovery to announce on loopback, and not on the runner's network.
        name: Multicast on loopback
        run: |
          sudo ip link set lo multicast on
          sudo ip route add 224.0.0.0/4 dev lo
          # Another network, which the test announces on too, and must not hear on loopback.
          sudo ip link add mdns0 type dummy
          sudo ip addr add 192.0.2.1/24 dev mdns0
          sudo ip link set mdns0 multicast on up
      -
        name: Vet
        run: go vet ./...
      -
        name: Test
        run: go test -race ./...
        env:
          ESPHOME_PYTHON: python
          ESPHOME_COMPAT_REQUIRED: "1"
          ESPHOME_MDNS_OTHER_INTERFACE: mdns0
      -
        # The binary as the release builds it, for this platform only.
        name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target

  # 64-bit atomic operations need an alignment 32-bit platforms don't give by themselves.
  test-32-bit:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Generate
        run: go generate ./...
      -
        name: Test
        run: GOARCH=386 go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Generate
        run: go generate ./...
      -
        name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  # Vulnerabilities in the code the module calls, of its dependencies and of Go.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Generate
        run: go generate ./...
      -
        name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  addon:
    # The Home Assistant add-on's manifest, as the Supervisor reads it.
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Lint the add-on
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: homeassistant/addon
      -
        name: Check the start script
        run: sh -n homeassistant/run.sh
