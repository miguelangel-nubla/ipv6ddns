name: ci

on:
  pull_request:
  push:
    branches:
      - main
      # Where the prereleases are made from.
      - dev
  # Weekly too: new vulnerabilities, and new Go releases, come without a commit.
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        # The Gravity API client is committed, so that go install and an import of the module
        # build: it is what its schema, pinned in ddns/gravity/main.go, generates.
        name: The generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- ddns/gravity
      -
        # Home Assistant's library for ESPHome devices, at the version Home Assistant uses: the
        # tests of the integration connect with it, and fail rather than skip without it.
        name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      -
        name: Install aioesphomeapi
        run: pip install aioesphomeapi==46.30.1
      -
        # For the test of discovery: Home Assistant's network, and another, which the test
        # announces on, and not on the runner's.
        name: Networks for mDNS
        run: |
          for n in 0 1; do
            sudo ip link add mdns$n type dummy
            sudo ip addr add 192.0.2.$((n + 1))/32 dev mdns$n
            sudo ip link set mdns$n multicast on up
          done
      -
        name: Vet
        run: go vet ./...
      -
        name: Test
        run: go test -race ./...
        env:
          ESPHOME_PYTHON: python
          ESPHOME_COMPAT_REQUIRED: "1"
          ESPHOME_MDNS_INTERFACES: mdns0,mdns1
      -
        # What only a real socket or a real link tells, as root, for the network namespaces: the
        # families an entry listens on, on Linux; the port the device announces by mDNS, found
        # and connected to by Home Assistant's libraries across a link; and the device dropping
        # a Home Assistant that vanishes, one that stops reading, and clients that say nothing.
        # And several instances at once, of the command as it is built: two on one machine, each
        # with its ports, its DNS server and its device, and two on two machines of one link. And
        # the resolver, asked with dig by the clients of the link. And the protocols of the
        # discovery, each sending or not as the configuration says, with the name a real mDNS
        # responder tells. And the add-on's starting configuration, served where Home Assistant's
        # Supervisor asks for its page, and nowhere else.
        name: Live tests
        run: |
          # dig asks the resolver, as its clients do; avahi-daemon tells a host's name by mDNS,
          # run by the tests on a machine of theirs: not the runner's own, which the package starts.
          sudo apt-get update -qq && sudo apt-get install -yqq --no-install-recommends bind9-dnsutils avahi-daemon udhcpc
          sudo systemctl disable --now avahi-daemon.socket avahi-daemon.service || true
          go vet -tags integration ./...
          go build -race -o "$RUNNER_TEMP/ipv6ddns" ./cmd/ipv6ddns
          go test -race -tags integration -exec "sudo env ESPHOME_PYTHON=$(which python) IPV6DDNS_COMMAND=$RUNNER_TEMP/ipv6ddns" -v -run '^TestLive' . ./cmd/ipv6ddns ./pkg/listen ./pkg/esphome
      -
        # The binaries as the release builds them, for every platform: one that no longer
        # compiles shows here, not at the tag.
        name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean

  # The DNS providers against the real servers that run in a container, of the versions pinned in
  # the script: Technitium DNS Server, Gravity, OpenWrt, and Mikrotik RouterOS under QEMU. A fake
  # of an API is written by the hand that wrote its provider, and agrees with it.
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        # RouterOS is an x86 machine: with KVM it boots in seconds, and emulated without.
        name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      -
        name: Vet
        run: go vet -tags live ./ddns
      -
        name: Live tests of the providers
        run: tools/live-providers.sh

  # 64-bit atomic operations need an alignment 32-bit platforms don't give by themselves.
  # macOS, with its own sockets, its own mDNS responder beside the program's, and no netlink: the
  # tests that need Linux skip there. The BSDs are built and vetted only.
  test-macos:
    runs-on: macos-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Test
        run: go test -race ./...

  test-32-bit:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Test
        run: GOARCH=386 go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags live ./ddns

  # Vulnerabilities in the code the module calls, of its dependencies and of Go.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  addon:
    # The Home Assistant add-on's manifest, as the Supervisor reads it.
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Lint the add-on
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: homeassistant/addon
      -
        # The image's entry point: it is copied with its mode, so it has to be executable here.
        name: Check the start script
        run: |
          sh -n homeassistant/run.sh
          test "$(git ls-files -s homeassistant/run.sh | cut -d' ' -f1)" = 100755
