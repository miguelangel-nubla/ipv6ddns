name: ci

on:
  pull_request:
  push:
    branches:
      - main
      # Where the prereleases are made from.
      - dev
  # Weekly too: new vulnerabilities, and new Go releases, come without a commit.
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        # The Gravity API client is committed, so that go install and an import of the module
        # build: it is what its schema, pinned in ddns/gravity/main.go, generates.
        name: The generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- ddns/gravity
      -
        # Home Assistant's library for ESPHome devices, at the version Home Assistant uses: the
        # tests of the integration connect with it, and fail rather than skip without it.
        name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      -
        name: Install aioesphomeapi
        run: pip install aioesphomeapi==46.30.1
      -
        # For the test of discovery: Home Assistant's network, and another, which the test
        # announces on, and not on the runner's.
        name: Networks for mDNS
        run: |
          for n in 0 1; do
            sudo ip link add mdns$n type dummy
            sudo ip addr add 192.0.2.$((n + 1))/32 dev mdns$n
            sudo ip link set mdns$n multicast on up
          done
      -
        name: Vet
        run: go vet ./...
      -
        name: Test
        run: go test -race ./...
        env:
          ESPHOME_PYTHON: python
          ESPHOME_COMPAT_REQUIRED: "1"
          ESPHOME_MDNS_INTERFACES: mdns0,mdns1
      -
        # What only a real socket or a real link tells, as root, for the network namespaces: the
        # families an entry listens on, on Linux; the port the device announces by mDNS, found
        # and connected to by Home Assistant's libraries across a link; and the device dropping
        # a Home Assistant that vanishes, one that stops reading, and clients that say nothing.
        # And several instances at once, of the command as it is built: two on one machine, each
        # with its ports, its DNS server and its device, and two on two machines of one link. And
        # the resolver, asked with dig by the clients of the link. And the protocols of the
        # discovery, each sending or not as the configuration says, with the name a real mDNS
        # responder tells. And the add-on's starting configuration, served where Home Assistant's
        # Supervisor asks for its page, and nowhere else.
        name: Live tests
        run: |
          # dig asks the resolver, as its clients do; avahi-daemon tells a host's name by mDNS,
          # run by the tests on a machine of theirs: not the runner's own, which the package starts.
          sudo apt-get update -qq && sudo apt-get install -yqq --no-install-recommends bind9-dnsutils avahi-daemon udhcpc
          sudo systemctl disable --now avahi-daemon.socket avahi-daemon.service || true
          go vet -tags integration ./...
          go build -race -o "$RUNNER_TEMP/ipv6ddns" ./cmd/ipv6ddns
          go test -race -tags integration -exec "sudo env ESPHOME_PYTHON=$(which python) IPV6DDNS_COMMAND=$RUNNER_TEMP/ipv6ddns" -v -run '^TestLive' . ./cmd/ipv6ddns ./pkg/listen ./pkg/esphome

  # The command, for a platform of each kind the release has, beside the tests and not after them:
  # one that no longer compiles shows here, not at the tag. The release's every platform, and its
  # configuration, are built weekly, in build-all.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm/7
          - darwin/arm64
          - windows/amd64
          - freebsd/amd64
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Build
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: |
          IFS=/ read -r GOOS GOARCH GOARM <<EOF
          $TARGET
          EOF
          export GOOS GOARCH GOARM
          go build -o /dev/null ./cmd/ipv6ddns

  # Every platform of the release, as goreleaser builds them, and its configuration: weekly, and
  # when asked, as they take a quarter of an hour.
  build-all:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean

  # The DNS providers against the real servers that run in a container, of the versions pinned in
  # the script: Technitium DNS Server, Gravity, AdGuard Home, Pi-hole, BIND, OpenWrt, and Mikrotik
  # RouterOS under QEMU. A fake of an API is written by the hand that wrote its provider, and agrees
  # with it.
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        # RouterOS is an x86 machine: with KVM it boots in seconds, and emulated without.
        name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      -
        name: Vet
        run: go vet -tags live ./ddns
      -
        name: Live tests of the providers
        run: tools/live-providers.sh

  # 64-bit atomic operations need an alignment 32-bit platforms don't give by themselves.
  # macOS, with its own sockets, its own mDNS responder beside the program's, and no netlink: the
  # tests that need Linux skip there. The BSDs are built and vetted only.
  test-macos:
    runs-on: macos-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Test
        run: go test -race ./...

  # The packages of a release, built as it builds them, and installed, started, upgraded and
  # removed where they are for: Debian, Fedora and Arch, each with its systemd, and Alpine, with
  # its OpenRC. In each, the service discovers a host as the package lets it.
  packages:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        # The packages of 32-bit ARM are run on a processor as a Raspberry Pi Zero's.
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Test
        run: tools/package-test.sh

  # The flake: the package for Nix builds, with the hash of the Go modules it has, and the
  # service of the NixOS module runs in a virtual machine, and discovers another.
  nix:
    runs-on: ubuntu-latest
    # It keeps the hash of the Go modules itself: on dev, it writes the commit that has it, and
    # starts CI on that commit, which a push of its own doesn't.
    permissions:
      contents: write
      actions: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        # Behind go.sum after a change of the modules: written again on dev, and anywhere else
        # told, as a pull request is not to be written to.
        name: The hash of the Go modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/nix-test.sh --update
          git diff --quiet -- nix/package.nix && exit 0
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::The hash of the Go modules in nix/package.nix is behind go.sum: run tools/nix-test.sh --update, and commit it."
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "build: the hash of the Go modules, for Nix" -- nix/package.nix
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:dev
          gh workflow run ci.yaml --ref dev
      -
        name: Test
        run: tools/nix-test.sh

  test-32-bit:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Test
        run: GOARCH=386 go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        # The Go of go.mod, not the latest: the linters are pinned, and one built for an older Go
        # can't read what a newer one compiles. The tests run on the latest, for a new Go's
        # changes; the linters move with go.mod, when both are bumped together.
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      -
        name: Staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags live ./ddns
      -
        # As .golangci.yaml says: the errors nothing checks, and the formatting, of gofmt. On every
        # system of the release, as each has files the others don't see; and the live tests, which
        # only their tags build.
        name: Golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          for os in linux darwin freebsd netbsd openbsd solaris windows; do
            echo "== $os"
            GOOS=$os GOARCH=amd64 golangci-lint run ./...
          done
          echo "== linux, integration"
          golangci-lint run --build-tags integration ./...
          echo "== linux, live"
          golangci-lint run --build-tags live ./...

  # Vulnerabilities in the code the module calls, of its dependencies and of Go.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  addon:
    # The Home Assistant add-on's manifest, as the Supervisor reads it.
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Lint the add-on
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: homeassistant/addon
      -
        # The image's entry point: it is copied with its mode, so it has to be executable here.
        name: Check the start script
        run: |
          sh -n homeassistant/run.sh
          test "$(git ls-files -s homeassistant/run.sh | cut -d' ' -f1)" = 100755
