name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 'stable'
          check-latest: true
      -
        name: Generate
        run: go generate ./...
      -
        name: Vet
        run: go vet ./...
      -
        name: Test
        run: go test ./...
      -
        # The binary as the release builds it, for this platform only.
        name: Build
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target
