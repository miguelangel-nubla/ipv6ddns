# ipv6ddns: the names to keep, and the DNS providers to keep them at.
#
# Until you add tasks, it only discovers: the add-on's page lists the hosts of the network and their
# MAC addresses, to choose from. Every key: https://github.com/miguelangel-nubla/ipv6ddns/blob/main/docs/reference/configuration.md
#
# An example: Home Assistant itself, its stable public IPv6 addresses and the network's public
# IPv4, as ha.example.com; and one host of the network, by its MAC, as www.example.com. At
# Cloudflare:
#
# sources:
#   wan:
#     type: dns
#
# tasks:
#   homeassistant:
#     filter:
#       - self: true
#         ip:
#           type: [global, "!temporary"]
#     sources: [wan]
#     endpoints:
#       cloudflare: [ha]
#   webserver:
#     filter:
#       - mac:
#           address: "00:11:22:33:44:55"
#         ip:
#           type: [global]
#     endpoints:
#       cloudflare: [www]
#
# credentials:
#   cloudflare:
#     provider: cloudflare
#     settings:
#       api_token: ${file:/config/cloudflare_token}   # a file beside this one
#       zone: example.com
#       ttl: 1h
#       proxied: false

tasks: {}
credentials: {}

# The add-on's page in Home Assistant: the report, served to Home Assistant alone, at the address
# its Supervisor reaches the add-on at, which the network outside doesn't. Keep these lines:
# without them the add-on still runs, and its page shows an error.
webserver:
  listen: 172.30.32.1:8053

# How much the log says: debug, info, warn or error.
log_level: info

# ipv6ddns as a device of Home Assistant's ESPHome integration: Home Assistant finds it, and shows
# each name's addresses, last update and problems, with a button to update now; and homeassistant
# sources read its entities. With key_provisioning, Home Assistant gives it its encryption key when
# you add it, kept in homeassistant.state in this folder.
homeassistant:
  # Where Home Assistant connects: every address of this machine, at 6053. Home Assistant's own
  # machine is on your network only; on one that faces the internet too, give the network Home
  # Assistant is on instead, as 192.168.1.0/24.
  listen: 6053
  key_provisioning: true

discovery:
  # Home Assistant's own containers, on its bridges, aren't hosts of the network.
  exclude_interfaces: [hassio, docker0, "veth*"]
