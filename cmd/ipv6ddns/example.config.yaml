log_level: info               # debug, info, warn, error
# Where the servers below listen, each entry with its scheme. See docs/resolver.md#listeners.
listeners:
  web:
    listen:                     # the report, /status.json and /metrics; or "http://8053,http://[::1]:8054"
      - http://8053
  lan:
    listen:
      - dns://192.168.1.0/24    # the machine's address in it, port 53
webservers:
  main:
    listeners:
      - web

# Addresses without a MAC, for the tasks that name them.
sources:
  # The network's public IPv4, as DNS resolvers see it: the A record of a server behind NAT.
  wan:
    type: dns
    family:
      - 4
    interval: 3m
  # Or from an echo service over HTTPS, or a command of yours:
  wan-http:
    type: http
    family:
      - 4
      - 6
  wan-command:
    type: command
    command: curl
    args:
      - -s
      - --ipv4
      - ifconfig.me
    interval: 3m
    lifetime: 10m
  # Addresses that don't change, or that discovery can't reach.
  fixed:
    type: static
    addresses:
      - 192.168.1.123
tasks:
  myhome:
    filter:
      - mac:
          address: 00:11:22:33:44:55
        ip:
          prefix: 2000::/3
    # And the public IPv4, for the A record.
    sources:
      - wan
    endpoints:
      mycloudflaresettings:
        - ""
  mylocalonlyserver:
    endpoints:
      mylocaldns:
      - myserver
      - "*.myserver"
    sources:
      - fixed
    filter:
      - mac:
          address: 00:11:22:33:44:56
        ip:
          prefix: fc00::/7
          type:
            - eui64
          # Only what the router's neighbor table has: an address it reports, of a host there.
          seen:
            - reported:
                by:
                  - mikrotik-lan
                from:
                  - neighbors
  # A device's local IPv4 addresses, once IPv4 discovery finds them: a filter takes IPv6 only
  # unless its family says.
  mynas:
    filter:
      - mac:
          address: 00:11:22:33:44:57
        ip:
          family:
            - 4
          type:
            - private
    endpoints:
      mylocaldns:
      - nas
      # And in the zone ipv6ddns answers itself, as nas.lan.example.com.
      home:
      - nas
# A DNS server of ipv6ddns's own, for the clients of the LAN: it answers the zones of its resolver
# credentials and asks the router the rest. See docs/resolver.md.
resolvers:
  lan:
    listeners:
      - lan
    upstream:
      - 192.168.1.1
      - 1.1.1.1
    records:
      - www.example.com. CNAME nas.lan.example.com.
credentials:
  home:
    provider: resolver
    settings:
      zone: lan.example.com
      records:
        - printer A 192.168.1.20
        - files CNAME nas
  duckdns:
    debounce: 10s
    provider: duckdns
    settings:
      api_token: 01234567-89ab-cdef-0123-456789abcdef
  mycloudflaresettings:
    debounce: 10s
    provider: cloudflare
    settings:
      api_token: 01234567-89ab-cdef-0123-456789abcdef
      proxied: false
      ttl: 1m
      zone: mydomain.tld
  mylocaldns:
    debounce: 10s
    provider: gravity
    settings:
      api_key: mykey
      server: http://192.168.x.x
      ttl: 10m
      zone: myzone.
  myopenwrtrouter:
    provider: openwrt
    settings:
      address: 192.168.1.1:22
      password: password
      ssh_key: <optional>/path/to/private/key
      # Recommended: the fingerprint of the host's SSH key. Without it any key is accepted, and
      # the log warns with the fingerprint seen. To get it: ssh-keyscan HOST | ssh-keygen -lf -
      # host_key: SHA256:...
      ttl: 10m
      username: root
      zone: lan
  myopnsensebox:
    debounce: 5s
    provider: opnsense_unbound
    retry: 1m
    settings:
      address: https://opnsense.local
      key: your_api_key
      secret: your_api_secret
      ttl: 1h
      # tls_fingerprint: the server certificate's SHA-256, in hex, when it can't be verified
      zone: example.com
  mypfsensebox:
    debounce: 5s
    provider: pfsense_restapi_unbound
    retry: 1m
    settings:
      address: https://pfsense.local
      key: your_api_key
      # tls_fingerprint: the server certificate's SHA-256, in hex, when it can't be verified
      zone: example.com
  myrouteros:
    provider: mikrotik
    settings:
      address: 192.168.88.1:8729
      password: password
      # tls_fingerprint: the server certificate's SHA-256, in hex, when it can't be verified
      ttl: 5m
      use_tls: true
      username: admin
      zone: lan
  mytechnitiumserver:
    provider: technitium
    settings:
      address: http://127.0.0.1:5380
      # tls_fingerprint: the server certificate's SHA-256, in hex, when it can't be verified
      token: mytoken
      ttl: 5m
      zone: example.com
  myroute53:
    provider: route53
    settings:
      access_key_id: AKIA...
      secret_access_key: your_secret_key
      region: us-east-1
      hosted_zone_id: Z1234567890
      ttl: 1h
  mywindowsdnsserver:
    provider: windows
    settings:
      # Optional: address to connect via SSH. If empty it will run locally on the Windows Server itself
      address: 192.168.1.5
      username: Administrator
      password: password
      ssh_key: <optional>/path/to/private/key
      # Recommended: the fingerprint of the host's SSH key. Without it any key is accepted, and
      # the log warns with the fingerprint seen. To get it: ssh-keyscan HOST | ssh-keygen -lf -
      # host_key: SHA256:...
      zone: example.com
      ttl: 1h
# The discovery is ipv6disc's, with its keys: docs/discovery.md. The families are the switches
# of all their protocols at once: listen, the local discovery; active, probing every host. The
# plugins read the tables of the families enabled.
discovery:
  lifetime: 1h        # how long a discovered address stays after it was last seen
  ipv6:
    enabled: true
    listen: true      # NDP, and the answers of the probes
    active: true      # multicast ping, SSDP, WS-Discovery
  # Off by default. Filters take IPv4 addresses only with ip.family 4, as the mynas task.
  ipv4:
    enabled: true
    listen: true      # the kernel's ARP table
    active: false     # a sweep of the subnets would broadcast an ARP request for each address
    lifetime: 5m      # an address not seen for 5m goes: discovery.lifetime by default
  # Asking the hosts the filters want, which aren't otherwise found. Off by default.
  solicit:
    ipv6: true        # the EUI-64 addresses eui64 filters want
    ipv4: true        # ARP to the MACs IPv4 filters name, alone, on the subnets of their ip.prefix
  # Each protocol has its switch, and its options: all are on by default, those that hear frames
  # on Linux. Every one is in docs/reference/configuration.md. The names of the hosts, which the
  # status page shows beside their MAC, are those the protocols learn.
  protocols:
    ssdp:                     # no search for UPnP devices
      enabled: false
    llmnr:                    # no question of LLMNR, which every host of the link hears
      enabled: false
  # Not on the bridges of containers: their hosts aren't the network's.
  exclude_interfaces:
    - docker*
    - br-*
    - veth*
  plugins:
    mikrotik-lan:
      type: mikrotik
      interval: 90s
      address: 192.168.88.1:8729
      username: admin
      # From the environment variable: see Secrets in docs/configuration.md.
      password: ${ROUTER_PASSWORD}
      use_tls: true
      # The SHA-256 of the router's certificate, 64 hex digits: needed for the self-signed one
      # RouterOS makes, which use_tls alone refuses, and only with use_tls: true. It is what
      #   openssl s_client -connect 192.168.88.1:8729 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256
      # prints.
      # tls_fingerprint: "0B:30:55:7A:9F:C4:E9:0E:33:58:7D:A2:C7:EC:11:36:5B:80:A5:CA:EF:14:39:5E:83:A8:CD:F2:17:3C:61:86"
    pfsense-box:
      type: freebsd
      interval: 90s
      address: pfsense.local
      username: admin
      identity_file: /path/to/id_rsa
      # Recommended: the fingerprint of the host's SSH key. To get it: ssh-keyscan HOST | ssh-keygen -lf -
      # host_key: SHA256:...
    linux-server:
      type: linux
      interval: 90s
      address: "[2001:db8::1]:2222"
      username: user
      identity_file: /path/to/id_rsa      # instead of a password, or besides it