version: 2
before:
  hooks:
    - go mod tidy
    # The manual page, compressed as the packages have it.
    - sh -c "gzip -9nc packaging/ipv6ddns.1 > packaging/ipv6ddns.1.gz"
builds:
  # Every system: the archives, and the images.
  - id: ipv6ddns
    main: ./cmd/ipv6ddns
    env:
      - CGO_ENABLED=0
    # The systems it runs on. On Solaris and Windows discovery has no neighbor table to read, and
    # on Windows NDP packets are not received: ipv6disc's discovery page tells what is left.
    goos:
      - darwin
      - freebsd
      - linux
      - netbsd
      - openbsd
      - solaris
      - windows
    goarch:
      - ppc64
      - 386
      - amd64
      - arm
      - arm64
      - loong64
      - mips
      - mipsle
      - mips64
      - mips64le
      - ppc64le
      - riscv64
      - s390x
    # ARMv5 is for ARM without a floating point unit, which a binary of ARMv6 or ARMv7 stops on at
    # its start: the Broadcom routers of Asuswrt-Merlin and Entware, and older ARM boards.
    goarm:
      - 5
      - 6
      - 7
    # MIPS without a floating point unit, as most routers' is: OpenWrt's kernel doesn't emulate one,
    # and a hardfloat binary stops there on an illegal instruction. Softfloat runs on a MIPS that
    # has one too, and there is little floating point here to be slower at. It is GOMIPS64 as well,
    # for mips64 and mips64le.
    gomips:
      - softfloat
  # The packages are of the machines Linux is installed on with a package manager: built again,
  # as a package takes every binary of the builds it names.
  #
  # The 32-bit ARM one is for ARMv6, which runs on ARMv7 too. Debian has one name for both,
  # armhf, and Raspberry Pi OS uses it on a Pi Zero, whose ARMv6 doesn't run a binary for ARMv7:
  # with a deb of each, both would install there, and one not run.
  - id: packages
    main: ./cmd/ipv6ddns
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
      - riscv64
    goarm:
      - 6
  # The rpm and the apk tell ARMv7 from ARMv6, armv7hl and armv7, and a system of the first
  # doesn't take a package of the second: one for each.
  - id: packages-armv7
    main: ./cmd/ipv6ddns
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - 7
# One image for every platform: the build context has the binary of each at <os>/<arch>[/<variant>]/.
dockers_v2:
  -
    ids:
      - ipv6ddns
    images:
      - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      # A prerelease, as v1.0.0-rc.1, has its own tags only: these stay on the last release.
      # Empty tags are ignored.
      - '{{ if not .Prerelease }}v{{ .Major }}{{ end }}'
      - '{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/386
      - linux/amd64
      - linux/arm/v6
      - linux/arm/v7
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "DNS names for every device on your network, on the LAN and on the internet, wherever its addresses move"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.licenses: Apache-2.0
    flags:
      - "--pull"
      - "--target=ipv6ddns"
  # The Home Assistant app: the same, started with its folder's configuration. It pulls the tag of its version,
  # without the v.
  -
    id: addon
    ids:
      - ipv6ddns
    images:
      - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}-addon"
    tags:
      - "{{ .Version }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    # The architectures of the add-on: Home Assistant's.
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - homeassistant/run.sh
      - homeassistant/starter.config.yaml
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }} Home Assistant app"
      org.opencontainers.image.description: "DNS names for every device on your network, on the LAN and on the internet, wherever its addresses move: the Home Assistant app"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.licenses: Apache-2.0
    flags:
      - "--pull"
      - "--target=addon"

archives:
  - 
    ids:
      - ipv6ddns
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - cmd/ipv6ddns/example.config.yaml
      - docs/**/*
      - CONTRIBUTING*
    formats: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
    - goos: windows
      formats: zip
# The packages of Linux: the binary, a service that an install doesn't start, of systemd in a
# deb, an rpm or Arch's package and of OpenRC in Alpine's apk, a configuration to begin from,
# which an upgrade keeps, and the manual page.
nfpms:
  - &package
    id: packages
    ids:
      - packages
    package_name: ipv6ddns
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    vendor: Miguel Angel Nubla
    maintainer: Miguel Angel Nubla <miguelangel.nubla@gmail.com>
    homepage: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
    description: |-
      DNS names for every device on your network, on the LAN and on the internet, wherever its addresses move
      ipv6ddns discovers the hosts of the network and keeps their addresses,
      IPv6 and IPv4, in the records of a DNS provider.
    license: Apache-2.0
    section: net
    bindir: /usr/bin
    contents:
      - src: packaging/ipv6ddns.service
        dst: /usr/lib/systemd/system/ipv6ddns.service
        packager: deb
      - src: packaging/ipv6ddns.service
        dst: /usr/lib/systemd/system/ipv6ddns.service
        packager: rpm
      - src: packaging/ipv6ddns.service
        dst: /usr/lib/systemd/system/ipv6ddns.service
        packager: archlinux
      - src: packaging/ipv6ddns.openrc
        dst: /etc/init.d/ipv6ddns
        packager: apk
        file_info:
          mode: 0755
      # The credentials are in it: root's alone to read.
      - src: packaging/config.yaml
        dst: /etc/ipv6ddns/config.yaml
        type: config|noreplace
        file_info:
          mode: 0600
      - dst: /etc/ipv6ddns
        type: dir
        file_info:
          mode: 0755
      - src: packaging/ipv6ddns.1.gz
        dst: /usr/share/man/man1/ipv6ddns.1.gz
      - src: cmd/ipv6ddns/example.config.yaml
        dst: /usr/share/doc/ipv6ddns/example.config.yaml
      - src: LICENSE.txt
        dst: /usr/share/doc/ipv6ddns/copyright
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh
    # Alpine and Arch tell their scripts nothing of what happens, and each has one of its own
    # for an upgrade. Arch's are parts of functions, which pacman calls.
    overrides:
      apk:
        scripts:
          postinstall: packaging/apk-postinstall.sh
          preremove: packaging/apk-preremove.sh
      archlinux:
        scripts:
          postinstall: packaging/arch-postinstall.sh
          preremove: packaging/arch-preremove.sh
          postremove: packaging/arch-postremove.sh
    apk:
      scripts:
        postupgrade: packaging/apk-postupgrade.sh
    archlinux:
      scripts:
        postupgrade: packaging/arch-postupgrade.sh
      packager: Miguel Angel Nubla <miguelangel.nubla@gmail.com>
  # The same, for ARMv7, where its package is another than ARMv6's: not a deb.
  - <<: *package
    id: packages-armv7
    ids:
      - packages-armv7
    formats:
      - rpm
      - apk
      - archlinux
# A tag with a prerelease part, as v1.0.0-rc.1, is a prerelease on GitHub: not the latest release.
release:
  prerelease: auto
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

