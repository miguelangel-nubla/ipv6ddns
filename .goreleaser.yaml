version: 2
before:
  hooks:
    - go mod tidy
    # The manual page, compressed as the packages have it.
    - sh -c "gzip -9nc packaging/ipv6ddns.1 > packaging/ipv6ddns.1.gz"
builds:
  - main: ./cmd/ipv6ddns
    env:
      - CGO_ENABLED=0
    goos:
      # - aix
      # - android
      - darwin
      # - dragonfly
      - freebsd
      # - illumos
      # - ios
      - js
      - linux
      - netbsd
      - openbsd
      # - plan9
      - solaris
      - windows # weird behaviour NDP packages not received
    goarch:
      - ppc64
      - 386
      - amd64
      - arm
      - arm64
      - wasm
      - loong64
      - mips
      - mipsle
      - mips64
      - mips64le
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - 6
      - 7
# One image for every platform: the build context has the binary of each at <os>/<arch>[/<variant>]/.
dockers_v2:
  -
    images:
      - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      # A prerelease, as v1.0.0-rc.1, has its own tags only: these stay on the last release.
      # Empty tags are ignored.
      - '{{ if not .Prerelease }}v{{ .Major }}{{ end }}'
      - '{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/386
      - linux/amd64
      - linux/arm/v6
      - linux/arm/v7
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "DNS names for every device on your network, wherever its addresses move"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.licenses: Apache-2.0
    flags:
      - "--pull"
      - "--target=ipv6ddns"
  # The Home Assistant app: the same, started with its folder's configuration. It pulls the tag of its version,
  # without the v.
  -
    id: addon
    images:
      - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}-addon"
    tags:
      - "{{ .Version }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    # The architectures of the add-on: Home Assistant's.
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - homeassistant/run.sh
      - homeassistant/starter.config.yaml
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }} Home Assistant app"
      org.opencontainers.image.description: "DNS names for every device on your network, wherever its addresses move: the Home Assistant app"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.licenses: Apache-2.0
    flags:
      - "--pull"
      - "--target=addon"

archives:
  - 
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - cmd/ipv6ddns/example.config.yaml
      - docs/**/*
      - CONTRIBUTING*
    formats: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
    - goos: windows
      formats: zip
# The packages of Linux: the binary, a service that an install doesn't start, of systemd in a deb
# or an rpm and of OpenRC in Alpine's apk, a configuration to begin from, which an upgrade keeps,
# and the manual page.
nfpms:
  -
    package_name: ipv6ddns
    formats:
      - deb
      - rpm
      - apk
    vendor: Miguel Angel Nubla
    maintainer: Miguel Angel Nubla <miguelangel.nubla@gmail.com>
    homepage: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
    description: |-
      DNS names for every device on your network, wherever its addresses move
      ipv6ddns discovers the hosts of the network and keeps their addresses,
      IPv6 and IPv4, in the records of a DNS provider.
    license: Apache-2.0
    section: net
    bindir: /usr/bin
    contents:
      - src: packaging/ipv6ddns.service
        dst: /usr/lib/systemd/system/ipv6ddns.service
        packager: deb
      - src: packaging/ipv6ddns.service
        dst: /usr/lib/systemd/system/ipv6ddns.service
        packager: rpm
      - src: packaging/ipv6ddns.openrc
        dst: /etc/init.d/ipv6ddns
        packager: apk
        file_info:
          mode: 0755
      # The credentials are in it: root's alone to read.
      - src: packaging/config.yaml
        dst: /etc/ipv6ddns/config.yaml
        type: config|noreplace
        file_info:
          mode: 0600
      - dst: /etc/ipv6ddns
        type: dir
        file_info:
          mode: 0755
      - src: packaging/ipv6ddns.1.gz
        dst: /usr/share/man/man1/ipv6ddns.1.gz
      - src: cmd/ipv6ddns/example.config.yaml
        dst: /usr/share/doc/ipv6ddns/example.config.yaml
      - src: LICENSE.txt
        dst: /usr/share/doc/ipv6ddns/copyright
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh
      postremove: packaging/postremove.sh
    # Alpine tells its scripts nothing of what happens, and has one of its own for an upgrade.
    overrides:
      apk:
        scripts:
          postinstall: packaging/apk-postinstall.sh
          preremove: packaging/apk-preremove.sh
    apk:
      scripts:
        postupgrade: packaging/apk-postupgrade.sh
# A tag with a prerelease part, as v1.0.0-rc.1, is a prerelease on GitHub: not the latest release.
release:
  prerelease: auto
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

