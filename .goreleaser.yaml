version: 2
before:
  hooks:
    - go generate ./...
    - go mod tidy
builds:
  - main: ./cmd/ipv6ddns
    env:
      - CGO_ENABLED=0
    goos:
      # - aix
      # - android
      - darwin
      # - dragonfly
      - freebsd
      # - illumos
      # - ios
      - js
      - linux
      - netbsd
      - openbsd
      # - plan9
      - solaris
      - windows # weird behaviour NDP packages not received
    goarch:
      - ppc64
      - 386
      - amd64
      - arm
      - arm64
      - wasm
      - loong64
      - mips
      - mipsle
      - mips64
      - mips64le
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - 6
      - 7
# One image for every platform: the build context has the binary of each at <os>/<arch>[/<variant>]/.
dockers_v2:
  -
    images:
      - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/386
      - linux/amd64
      - linux/arm/v6
      - linux/arm/v7
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.licenses: Apache-2.0
    flags:
      - "--pull"
      - "--target=ipv6ddns"
  # The Home Assistant add-on: the same, started from its options. It pulls the tag of its version,
  # without the v.
  -
    id: addon
    images:
      - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}-addon"
    tags:
      - "{{ .Version }}"
      - latest
    # The architectures of the add-on: Home Assistant's.
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - homeassistant/run.sh
      - homeassistant/starter.config.yaml
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }} Home Assistant add-on"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
      org.opencontainers.image.licenses: Apache-2.0
    flags:
      - "--pull"
      - "--target=addon"

archives:
  - 
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - cmd/ipv6ddns/example.config.yaml
      - docs/**/*
      - CONTRIBUTING*
    formats: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
    - goos: windows
      formats: zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
